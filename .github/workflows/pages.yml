name: pages

# The download page, site/, published to GitHub Pages.  It deploys
# when a release is published, not when site/ is merged: the release
# job makes a draft, releases/latest ignores drafts, and a merged page
# would say "New in" a version while its buttons still served the last
# one.  Run it by hand for a page-only edit between releases.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queued runs still collapse to the newest, but a deploy already
# running is left to finish rather than cut off halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
