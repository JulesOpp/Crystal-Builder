name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # A run takes about five minutes.  The cap was 30 and that is
    # what a hung job cost: a test that opened a context menu waited
    # for a click nobody could make, and three jobs burned half an
    # hour each to say so.  Twelve is still twice the longest honest
    # run, and `faulthandler_timeout` below names the test before the
    # cap is reached rather than leaving "The operation was canceled".
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        # The three platforms we ship, and nothing else.  Linux used
        # to carry the version sweep here because it is the cheap
        # runner, but nothing is released for it: what that bought
        # was three more ways for a red tick to mean something
        # nobody is going to install.
        include:
          - os: macos-14          # Apple silicon
            python: "3.12"
          - os: macos-15-intel    # Intel.  Not macos-13: that image
            python: "3.12"        # was retired on 2025-12-04 and a
                                  # job asking for it is not refused,
                                  # it queues for the full 24 h and
                                  # then fails the run.
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # setuptools-scm needs the tags
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Dormant while the matrix above ships no Linux entry, and kept
      # rather than deleted because it is the whole of what anybody
      # putting one back needs to know:
      # PySide6 links these and the runner images do not carry them,
      # so `import PySide6.QtGui` fails with
      # `libEGL.so.1: cannot open shared object file` before a single
      # test runs.  pytest-qt imports QtGui during pytest_configure,
      # which turns it into an INTERNALERROR rather than a skip.
      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0
      # `ase` is here because the MOF builder needs it.  PORMAKE is
      # vendored (xtal/mof/pormake) and is written over ase.Atoms and
      # ase.neighborlist, so without this extra every build test
      # skips itself -- which is how the MOF builder went untested on
      # CI for its whole life, back when PORMAKE was an extra nobody
      # installed here.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,build,ase,test]"
      - name: Test
        # Qt needs a platform plugin with no display; the VTK render
        # tests skip themselves where offscreen OpenGL is unavailable.
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: pyside6
        # `python -m pytest` and not bare `pytest`, which is what
        # CLAUDE.md prescribes and is load-bearing rather than
        # stylistic: the -m form puts the working directory on
        # sys.path, and a dozen test modules do
        # `from tests.conftest_ff import ...`.  Bare `pytest` does
        # not, so every one of them failed to import with
        # `ModuleNotFoundError: No module named 'tests'`.
        # -o faulthandler_timeout: any test still going after three
        # minutes dumps every thread's stack into the log, which is
        # how a hang names itself instead of being cancelled in
        # silence.  No honest test here is close to it: the slowest
        # are about eleven seconds.
        run: python -m pytest -q -o faulthandler_timeout=180

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # ruff check only -- the codebase is hand-formatted to 79
      # columns and ruff format would fight it.
      - run: pipx run ruff check .

  # Build the bundle on every push to main as well as on a tag, and
  # not only when releasing.  A spec file rots the moment somebody
  # adds an import, and finding that out at tag time -- when the tag
  # is already pushed -- is the worst possible moment.  On a tag this
  # job also packages and uploads; on main it just has to produce a
  # bundle that passes --selftest.
  build:
    name: bundle · ${{ matrix.label }}
    needs: test
    timeout-minutes: 60
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple silicon
            label: macos-arm64
            spec: packaging/macos.spec
          - os: macos-15-intel    # Intel.  VTK publishes no
            label: macos-x86_64   # universal2 wheel, so two builds.
            spec: packaging/macos.spec   # See the note above about
                                         # macos-13.
          - os: windows-latest
            label: windows-x64
            spec: packaging/windows.spec
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # setuptools-scm needs the tags, and
                                  # a shallow clone builds 0.0.dev0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # `ase` is not optional for a *build*, whatever pyproject calls
      # it: the MOF builder is vendored into the application now, and
      # a bundle without ase ships it greyed out saying "pip install
      # crystal-builder[ase]" to somebody who double-clicked a DMG --
      # which is the exact failure vendoring PORMAKE was done to end.
      #
      # The deployment target is for whatever pip compiles rather than
      # downloads, which otherwise targets the runner's own macOS:
      # spglib 2.7.0 has no Intel wheel, and the sdist built on
      # macos-15-intel needed macOS 15.  It is the
      # LSMinimumSystemVersion in macos.spec; Windows ignores it.
      - name: Install
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.3"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,build,sketch,ase]" pyinstaller

      # numpy and scipy each publish a macOS 14 wheel on the new
      # Accelerate beside a macOS 12 one on OpenBLAS, and pip on a
      # macOS 14 runner takes the first -- a bundle that passes its
      # selftest here and dies importing numpy on macOS 13.  Swap in
      # the macOS 12 builds of the same versions.  pip matches wheel
      # tags, which say 12_0; the binaries inside say 12.3, which is
      # why that is the LSMinimumSystemVersion in macos.spec, and
      # postbuild.py fails the job if anything is newer than it.
      - name: Wheels for the oldest supported macOS
        if: runner.os == 'macOS'
        run: |
          pip download --no-deps --only-binary=:all: \
              --python-version 3.12 \
              --platform "macosx_12_0_$(uname -m)" -d floor-wheels \
              "numpy==$(python -c 'import numpy; print(numpy.__version__)')" \
              "scipy==$(python -c 'import scipy; print(scipy.__version__)')"
          pip install --force-reinstall --no-deps floor-wheels/*.whl

      - name: Build
        env:
          QT_API: pyside6
        run: pyinstaller --noconfirm ${{ matrix.spec }}

      # The bundle's own smoke test, run against the built thing
      # rather than the checkout.  It is the only layer that can say
      # anything about copy_metadata, the resource lookups through
      # PyInstaller's symlinks, and whether VTK still has an OpenGL
      # context after the excludes.  XTAL_NO_CONFIRM_CLOSE per
      # CLAUDE.md: a modal nobody answers hangs the job.
      # Strip and drop the unused Qt plugins, then sign.  Not a
      # tidying step: it is about 175 MB of the download, and
      # PyInstaller's own strip cannot do the larger half of it.  See
      # the module docstring.  Signing happens here, after the file
      # rewriting, because a signature made before stripping is
      # invalidated by it and an invalid one will not launch at all
      # on Apple silicon.
      - name: Strip and sign (macOS)
        if: runner.os == 'macOS'
        run: python packaging/postbuild.py "dist/Crystal Builder.app"

      # Read back what it said, and not only what it returned.  The
      # exit code alone let a Windows run go green having died inside
      # the 3D view: no traceback, no `selftest FAILED`, no image, and
      # a green tick -- so what the job proved was that the bundle
      # starts.  `packaging/release-macos.sh` has always grepped its
      # output for exactly this reason; this is the same check, in the
      # place that gates a release.
      - name: Selftest (macOS)
        if: runner.os == 'macOS'
        env:
          XTAL_NO_CONFIRM_CLOSE: "1"
        run: |
          set -o pipefail
          "dist/Crystal Builder.app/Contents/MacOS/Crystal Builder" \
              --selftest --selftest-image selftest.png | tee selftest.log
          grep -q "selftest passed" selftest.log \
              || { echo "::error::the selftest did not run to the end"; \
                   exit 1; }
          test -s selftest.png \
              || { echo "::error::the selftest drew no image"; exit 1; }

      # VTK needs an OpenGL context and the runner has no GPU.  What
      # stood here claimed Windows "falls back to the software
      # rasteriser"; it does not.  It asks for `osmesa.dll`, which is
      # not on the image -- and is not in Mesa's Windows package
      # either.  What that package has is the WGL driver, which is
      # the better answer anyway: Mesa goes beside the executable and
      # VTK's ordinary `vtkWin32OpenGLRenderWindow` gets a real
      # llvmpipe context through its normal path rather than a
      # fallback.
      #
      # The `.local` is the load-bearing half and it is one byte:
      # without it Windows resolves `opengl32.dll` from system32 and
      # never looks at the copy beside the executable, which is the
      # failure that looks exactly like not having copied it.
      - name: Software OpenGL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "26.2.0"
          $url = "https://github.com/pal1000/mesa-dist-win/releases" +
                 "/download/$version/mesa3d-$version-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          $app = "dist/Crystal Builder"
          $added = @()
          foreach ($dll in "opengl32.dll", "libgallium_wgl.dll",
                           "dxil.dll") {
            Copy-Item "mesa/x64/$dll" $app -Force
            $added += $dll
          }
          Set-Content -Path "$app/Crystal Builder.exe.local" -Value ""
          $added += "Crystal Builder.exe.local"
          # Written down rather than repeated in the step that takes
          # them out again, so the two lists cannot drift apart.
          $added | Set-Content mesa-files.txt

      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          XTAL_NO_CONFIRM_CLOSE: "1"
          # llvmpipe by name, so that a Mesa which would rather use
          # d3d12 on a machine with no GPU does not quietly pick the
          # path this step is not testing.
          GALLIUM_DRIVER: llvmpipe
        run: |
          # Both preferences off, so that a non-zero exit does not
          # become a terminating error before the output it needs to
          # be diagnosed by has been printed.  The checks below are
          # what fails this step.
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          & "dist/Crystal Builder/Crystal Builder.exe" `
              --selftest --selftest-image selftest.png 2>&1 |
              Tee-Object -FilePath selftest.log
          $code = $LASTEXITCODE
          $said = Get-Content selftest.log -Raw
          if ($code -ne 0) {
            Write-Host "::error::the selftest exited $code"
            exit 1
          }
          if ($said -notmatch "selftest passed") {
            Write-Host "::error::the selftest did not run to the end"
            exit 1
          }
          if (-not (Test-Path selftest.png)) {
            Write-Host "::error::the selftest drew no image"
            exit 1
          }

      # Mesa was for the selftest and must not reach a user.  The
      # installer takes `dist\Crystal Builder\*` with recursesubdirs,
      # so anything still in that folder is shipped -- and what is in
      # it is an `opengl32.dll` that overrides the GPU driver of every
      # machine it lands on, turning a hardware-rendered viewport into
      # a software-rendered one on hardware that was fine.  Removing
      # without -ErrorAction so a file that is not there fails the
      # job, and the check after it is for the same mistake made a
      # different way.
      - name: Take the software OpenGL back out (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "dist/Crystal Builder"
          Get-Content mesa-files.txt | ForEach-Object {
            Remove-Item "$app/$_" -Force
          }
          $left = Get-ChildItem $app -Recurse -Include `
              opengl32.dll, libgallium_wgl.dll, "*.local"
          if ($left) {
            Write-Host "::error::Mesa is still in the bundle:"
            $left | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }

      # hdiutil, not create-dmg: create-dmg positions the icons by
      # driving Finder over Apple events, which a runner is not
      # authorised to do and cannot be asked to allow.  What that
      # buys is a background image and icon placement, which is
      # explicitly not phase 8; what it does not affect is the volume
      # name, the app, or the /Applications symlink to drag it to.
      - name: Package (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: python packaging/makedmg.py "dist/Crystal Builder.app" .

      # ISCC is on the runner image today, but "today" is not a
      # contract and this step only ever runs on a tag -- the worst
      # possible moment to find out otherwise.  Look for it, install
      # it if it is not there, and fail with a sentence rather than
      # with "term not recognised" if neither works.
      - name: Package (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path `
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", `
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem -Path `
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", `
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" `
              -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup 6 is not on this runner and could not be installed"
          }
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          & $iscc.FullName "/DAppVersion=$version" `
            packaging\crystal-builder.iss

      # `error`, not `ignore`.  On a plain push only `selftest.png`
      # matches -- the .dmg and the installer are made on a tag -- so
      # this asks the one question `ignore` was silently answering
      # wrong: the Windows job uploaded no artifact at all for weeks
      # and said nothing, because the image it should have carried
      # was never drawn.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          if-no-files-found: error
          path: |
            *.dmg
            dist/*.exe
            selftest.png

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
          body_path: docs/RELEASE_NOTES.md
          draft: true
          fail_on_unmatched_files: true
