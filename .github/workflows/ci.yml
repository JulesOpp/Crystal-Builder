name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The core is headless, so the bulk of the matrix is cheap
        # Linux; macOS (arm64 + x86_64) and Windows are the platforms
        # we actually ship, so they get one run each.
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-14          # Apple silicon
            python: "3.12"
          - os: macos-13          # Intel
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # setuptools-scm needs the tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,build,test]"
      - name: Test
        # Qt needs a platform plugin with no display; the VTK render
        # tests skip themselves where offscreen OpenGL is unavailable.
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: pyside6
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ruff check only -- the codebase is hand-formatted to 79
      # columns and ruff format would fight it.
      - run: pipx run ruff check .
