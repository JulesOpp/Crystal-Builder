name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # A branch's bundle, built by hand -- the launcher, say -- before main.
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # A run takes about five minutes.  The cap was 30 and that is
    # what a hung job cost: a test that opened a context menu waited
    # for a click nobody could make, and three jobs burned half an
    # hour each to say so.  Twelve is still twice the longest honest
    # run, and `faulthandler_timeout` below names the test before the
    # cap is reached rather than leaving "The operation was canceled".
    # Except on Intel macOS and Windows, which are the slow runners:
    # at 4000 tests an honest Windows run is 10-12 minutes and an
    # Intel one 13-20, and both caps cancelled green suites at 100 %
    # on 2026-09-30.  A hang is still caught per test at 180 s.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 30 || matrix.os == 'windows-latest' && 20 || 12 }}
    strategy:
      fail-fast: false
      matrix:
        # The platforms we ship, and nothing else.  Linux left this
        # list while nothing was released for it -- a red tick there
        # meant something nobody was going to install -- and is back
        # because an AppImage is released for it now.  One row, not
        # the version sweep it used to carry: the bundle is built on
        # one Python, and so is every other row here.
        include:
          - os: macos-14          # Apple silicon
            python: "3.12"
          - os: macos-15-intel    # Intel.  Not macos-13: that image
            python: "3.12"        # was retired on 2025-12-04 and a
                                  # job asking for it is not refused,
                                  # it queues for the full 24 h and
                                  # then fails the run.
          - os: windows-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # setuptools-scm needs the tags
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # PySide6 links these and the runner images do not carry them,
      # so `import PySide6.QtGui` fails with
      # `libEGL.so.1: cannot open shared object file` before a single
      # test runs.  pytest-qt imports QtGui during pytest_configure,
      # which turns it into an INTERNALERROR rather than a skip.
      # libosmesa6 and mesa-utils so that VTK finds an offscreen
      # OpenGL and the render tests run rather than skip themselves:
      # skipped, they are green on the one platform with no GPU and
      # no Mesa of its own, which is exactly where they were meant to
      # say something.  libfontconfig1 is Qt's way to any font at all.
      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libosmesa6 mesa-utils libfontconfig1
      # `ase` is here because the MOF builder needs it.  PORMAKE is
      # vendored (xtal/mof/pormake) and is written over ase.Atoms and
      # ase.neighborlist, so without this extra every build test
      # skips itself -- which is how the MOF builder went untested on
      # CI for its whole life, back when PORMAKE was an extra nobody
      # installed here.
      # `sketch` and `pxrd` too: without them about sixty tests skip
      # themselves on every run, and the selftest below refuses to
      # pass without rdeditor, because the extras page promises it.
      # `refine` (RietX) is NOT here, as the ML engines are not: the
      # powder tests are 150 tests and about thirteen CPU-minutes
      # (2026-09-26, 2.5 min on three workers under swap), and the
      # rule ROADMAP 11 set was "under ~30 s or run locally".  Without
      # it they skip themselves, and the selftest from the checkout
      # skips its powder check.  The bundle job below installs it,
      # and the bundle's selftest refines rutile inside the build.
      # `mcp`, or the AI assistant's server, proxy and tool tests all
      # skip themselves and the window's side is never run on Windows.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,build,sketch,pxrd,ase,mcp,test]"
      - name: Test
        # Qt needs a platform plugin with no display; the VTK render
        # tests skip themselves where offscreen OpenGL is unavailable.
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: pyside6
        # `python -m pytest` and not bare `pytest`, which is what
        # CLAUDE.md prescribes and is load-bearing rather than
        # stylistic: the -m form puts the working directory on
        # sys.path, and a dozen test modules do
        # `from tests.conftest_ff import ...`.  Bare `pytest` does
        # not, so every one of them failed to import with
        # `ModuleNotFoundError: No module named 'tests'`.
        # -o faulthandler_timeout: any test still going after three
        # minutes dumps every thread's stack into the log, which is
        # how a hang names itself instead of being cancelled in
        # silence.  No honest test here is close to it: the slowest
        # are about eleven seconds.
        run: python -m pytest -q -o faulthandler_timeout=180

      # The one check that opens the real window and draws the 3D view,
      # which every widget test replaces with a stub -- so a PySide6
      # that hangs the viewport passes the whole suite.  It ran only on
      # the bundle, after a merge; run from the checkout it tells the
      # pull request instead.  Not under the offscreen platform the
      # tests use: VTK gets no OpenGL context there and segfaults.
      # macOS only: a Windows runner has no GPU, and the Mesa the
      # bundle job lays beside the .exe has nowhere to go in a venv.
      - name: Selftest from the checkout (macOS)
        if: runner.os == 'macOS'
        env:
          XTAL_NO_CONFIRM_CLOSE: "1"
          XTAL_WORKSPACE_ROOT: ${{ runner.temp }}/selftest-workspace
          QT_API: pyside6
        run: |
          set -o pipefail
          crystal-builder --selftest --selftest-image selftest.png \
              | tee selftest.log
          grep -q "selftest passed" selftest.log \
              || { echo "::error::the selftest did not run to the end"; \
                   exit 1; }
          test -s selftest.png \
              || { echo "::error::the selftest drew no image"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # ruff check only -- the codebase is hand-formatted to 79
      # columns and ruff format would fight it.  Pinned: a new ruff
      # brings new rules, and a release commit should not go red
      # because one was published overnight.  Raise it on purpose,
      # with ruff check . clean locally at the new version.
      - run: pipx run ruff==0.16.9 check .

  # The user manual, docs/manual: HTML with every warning an error --
  # a broken cross-reference is a warning, and it is what a renamed
  # command leaves behind -- then the PDF, uploaded to look at.  The
  # reference pages are generated from the application and committed,
  # so nothing here needs a display or the application installed.
  manual:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # the backstop for a cold cache on a slow mirror
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # tags: the manual names its release
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "sphinx>=7" "myst-parser>=3"
             "sphinxcontrib-bibtex>=2.6" "furo>=2024.1"
      - run: sphinx-build -n -W --keep-going -b html docs/manual
             build/manual/html
      # Cached, because the Ubuntu mirror sometimes crawls past the timeout.
      - name: LaTeX
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: latexmk texlive-xetex texlive-latex-recommended
            texlive-latex-extra texlive-fonts-recommended fonts-freefont-otf
          version: 1.0
          # Not the action's: it runs the scripts in package-name order, before the binaries they need are restored.  The step below registers.
          execute_install_scripts: false
      # mktexlsr the file database, updmap-sys the font maps, fmtutil-sys the XeTeX formats latexmk uses, fc-cache so fontconfig sees Latin Modern; quick on a cold install, required on a cache hit.
      - name: Register the restored TeX packages
        run: |
          sudo mktexlsr
          sudo updmap-sys --quiet
          sudo fmtutil-sys --byengine xetex --quiet
          fc-cache -f
      - run: sphinx-build -M latexpdf docs/manual build/manual
      - uses: actions/upload-artifact@v7
        with:
          name: crystal-builder-manual
          path: |
            build/manual/latex/crystal-builder-manual.pdf
            build/manual/html

  # Build the bundle on every push to main as well as on a tag, and
  # not only when releasing.  A spec file rots the moment somebody
  # adds an import, and finding that out at tag time -- when the tag
  # is already pushed -- is the worst possible moment.  On a tag this
  # job also packages and uploads; on main it just has to produce a
  # bundle that passes --selftest.
  build:
    name: bundle · ${{ matrix.label }}
    needs: test
    timeout-minutes: 60
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple silicon
            label: macos-arm64
            spec: packaging/macos.spec
          - os: macos-15-intel    # Intel.  VTK publishes no
            label: macos-x86_64   # universal2 wheel, so two builds.
            spec: packaging/macos.spec   # See the note above about
                                         # macos-13.
          - os: windows-latest
            label: windows-x64
            spec: packaging/windows.spec
          - os: ubuntu-22.04      # glibc 2.35 is the floor the AppImage
            label: linux-x86_64   # runs on: it needs the glibc it was
            spec: packaging/linux.spec   # built against or newer, so
                                         # not ubuntu-latest.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # setuptools-scm needs the tags, and
                                  # a shallow clone builds 0.0.dev0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # `ase` is not optional for a *build*, whatever pyproject calls
      # it: the MOF builder is vendored into the application now, and
      # a bundle without ase ships it greyed out saying "pip install
      # crystal-builder[ase]" to somebody who double-clicked a DMG --
      # which is the exact failure vendoring PORMAKE was done to end.
      #
      # The deployment target is for whatever pip compiles rather than
      # downloads, which otherwise targets the runner's own macOS:
      # spglib 2.7.0 has no Intel wheel, and the sdist built on
      # macos-15-intel needed macOS 15.  It is the
      # LSMinimumSystemVersion in macos.spec; Windows ignores it.
      #
      # `refine` likewise: the refinement workbench is on the extras
      # page as bundled, and the selftest fails a build without it.
      #
      # Except on Intel, where rietx asks for numba >= 0.63 and numba
      # stopped publishing Intel macOS wheels at 0.63: pip falls back
      # to llvmlite's sdist, which needs an LLVM the runner does not
      # have.  So Intel resolves everything else against 0.62.1, the
      # last numba with an Intel wheel, and takes rietx with
      # --no-deps -- its other requirements are already there, bar
      # pydantic.  rietx 1.5 refines rutile on 0.62.1 exactly as on
      # 0.67, and the selftest below re-proves it in every build.
      #
      # cryptography too (mcp's, through pyjwt[crypto]): 49 dropped its
      # Intel wheel, and the sdist built here links Homebrew's OpenSSL,
      # whose dylibs are built for the runner's macOS 15 -- which
      # postbuild.py then refuses against the 12.3 in Info.plist.
      # 48.0.1 is the last with a universal2 wheel, OpenSSL inside it.
      - name: Install
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.3"
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = macOS ] && [ "$(uname -m)" = x86_64 ]; then
            pip install -e ".[gui,build,sketch,ase,pxrd,mcp]" pyinstaller \
                "numba==0.62.1" pydantic "cryptography==48.0.1"
            refine=$(python -c 'import tomllib; print(*tomllib.load(
                open("pyproject.toml", "rb"))["project"]
                ["optional-dependencies"]["refine"])')
            pip install --no-deps $refine
          else
            pip install -e ".[gui,build,sketch,ase,pxrd,refine,mcp]" pyinstaller
          fi

      # numpy and scipy each publish a macOS 14 wheel on the new
      # Accelerate beside a macOS 12 one on OpenBLAS, and pip on a
      # macOS 14 runner takes the first -- a bundle that passes its
      # selftest here and dies importing numpy on macOS 13.  Swap in
      # the macOS 12 builds of the same versions.  pip matches wheel
      # tags, which say 12_0; the binaries inside say 12.3, which is
      # why that is the LSMinimumSystemVersion in macos.spec, and
      # postbuild.py fails the job if anything is newer than it.
      - name: Wheels for the oldest supported macOS
        if: runner.os == 'macOS'
        run: |
          pip download --no-deps --only-binary=:all: \
              --python-version 3.12 \
              --platform "macosx_12_0_$(uname -m)" -d floor-wheels \
              "numpy==$(python -c 'import numpy; print(numpy.__version__)')" \
              "scipy==$(python -c 'import scipy; print(scipy.__version__)')"
          pip install --force-reinstall --no-deps floor-wheels/*.whl

      # Help > User Manual opens the HTML built here, which
      # packaging/bundle.py collects into manual/ and --selftest
      # insists on.  In a venv of its own, so that Sphinx's
      # requirements cannot move a wheel the bundle is pinned to.
      - name: The user manual
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/docs"
          py="$RUNNER_TEMP/docs/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/docs/Scripts/python.exe"
          "$py" -m pip install -q "sphinx>=7" "myst-parser>=3" \
              "sphinxcontrib-bibtex>=2.6" "furo>=2024.1"
          "$py" -m sphinx -q -b html docs/manual build/manual/html
          test -f build/manual/html/index.html

      # Read off this environment's metadata, which is the bundle's:
      # packaging/bundle.py collects it and --selftest fails without.
      - name: Third-party notices
        run: python scripts/third_party_notices.py

      # PyInstaller collects what the platform plugin links from the
      # build host, and a library that is not installed is not
      # collected -- it is simply missing on the user's machine, where
      # Qt then says only "could not load the Qt platform plugin xcb".
      # The test job's list, which is what `xcb` needs, plus
      # libfontconfig1.  glibc, libGL, libEGL and libxcb itself are
      # left to the user's system; see docs/LINUX.md.
      - name: Qt's system libraries (Linux bundle)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libfontconfig1

      - name: Build
        env:
          QT_API: pyside6
        run: pyinstaller --noconfirm ${{ matrix.spec }}

      # The same reason as macOS's: most of the download is Qt the
      # application never reaches and debug symbols nobody reads.  See
      # the module docstring for what goes and why the rest stays.
      - name: Strip (Linux)
        if: runner.os == 'Linux'
        run: python packaging/postbuild_linux.py "dist/Crystal Builder"

      # The tool and the runtime both, each pinned to a numbered
      # release and checked against the SHA-256 GitHub reports for
      # that asset (read 2026-10-09).  The runtime is the executable
      # every AppImage starts with, and appimagetool downloads
      # whatever upstream calls current at pack time unless it is
      # handed one -- so pinning the tool alone left unpinned the
      # first thing a user runs.  A release asset can be replaced
      # under the same URL, and both projects' `continuous` tags are
      # on every rebuild: the checksums make the pair that packs a
      # release the pair somebody looked at, and a download that
      # changed fails here instead.  No libfuse2: the runners have no
      # FUSE, so every AppImage this job starts, the tool included,
      # extracts itself and runs (APPIMAGE_EXTRACT_AND_RUN=1).  Into
      # the runner's temp and not the working directory, where the
      # upload's `*.AppImage` would take the tool for the download
      # and the release would attach it.
      - name: appimagetool
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: |
          url=https://github.com/AppImage/appimagetool/releases/download
          tag=1.9.1
          sha=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          curl -fsSLO "$url/$tag/appimagetool-x86_64.AppImage"
          echo "$sha  appimagetool-x86_64.AppImage" | sha256sum -c -
          chmod +x appimagetool-x86_64.AppImage
          url=https://github.com/AppImage/type2-runtime/releases/download
          tag=20251108
          sha=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          curl -fsSLO "$url/$tag/runtime-x86_64"
          echo "$sha  runtime-x86_64" | sha256sum -c -

      # On every bundle run, not only on a tag: the AppImage is what
      # the selftest below runs, because it is what a user downloads,
      # and the folder it is packed from has another launcher path.
      # appimage.py asks Qt for the PNG icon, offscreen.
      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_API: pyside6
        run: |
          python packaging/appimage.py "dist/Crystal Builder" . \
              --tool "$RUNNER_TEMP/appimagetool-x86_64.AppImage" \
              --runtime "$RUNNER_TEMP/runtime-x86_64"

      # Strip and drop the unused Qt plugins, then sign.  Not a
      # tidying step: it is about 175 MB of the download, and
      # PyInstaller's own strip cannot do the larger half of it.  See
      # the module docstring.  Signing happens here, after the file
      # rewriting, because a signature made before stripping is
      # invalidated by it and an invalid one will not launch at all
      # on Apple silicon.
      - name: Strip and sign (macOS)
        if: runner.os == 'macOS'
        run: python packaging/postbuild.py "dist/Crystal Builder.app"

      # The bundle's own smoke test, run against the built thing
      # rather than the checkout.  It is the only layer that can say
      # anything about copy_metadata, the resource lookups through
      # PyInstaller's symlinks, and whether VTK still has an OpenGL
      # context after the excludes.  XTAL_NO_CONFIRM_CLOSE per
      # CLAUDE.md: a modal nobody answers hangs the job.
      #
      # Read back what it said, and not only what it returned.  The
      # exit code alone let a Windows run go green having died inside
      # the 3D view: no traceback, no `selftest FAILED`, no image, and
      # a green tick -- so what the job proved was that the bundle
      # starts.  `packaging/release-macos.sh` has always grepped its
      # output for exactly this reason; this is the same check, in the
      # place that gates a release.
      - name: Selftest (macOS)
        if: runner.os == 'macOS'
        env:
          XTAL_NO_CONFIRM_CLOSE: "1"
        run: |
          set -o pipefail
          "dist/Crystal Builder.app/Contents/MacOS/Crystal Builder" \
              --selftest --selftest-image selftest.png | tee selftest.log
          grep -q "selftest passed" selftest.log \
              || { echo "::error::the selftest did not run to the end"; \
                   exit 1; }
          test -s selftest.png \
              || { echo "::error::the selftest drew no image"; exit 1; }

      # The runner would lend the AppImage what it lost: the build
      # installed Qt's xcb helpers, xkbcommon and fontconfig here, and
      # a selftest that passed on the runner's copies would fail on a
      # desktop without them.  Removing them from the runner would
      # test a machine nobody has, so the image is opened instead and
      # asked whether it carries its own.
      - name: What the AppImage carries (Linux)
        if: runner.os == 'Linux'
        run: |
          images=(Crystal_Builder-*-x86_64.AppImage)
          [ "${#images[@]}" = 1 ] && [ -f "${images[0]}" ] \
              || { echo "::error::expected one AppImage, found" \
                        "${images[*]}"; exit 1; }
          image="$PWD/${images[0]}"
          unpacked="$(mktemp -d)"
          cd "$unpacked"
          "$image" --appimage-extract >/dev/null
          lib=squashfs-root/usr/lib/crystal-builder
          missing=0
          for name in libxcb-cursor.so.0 libxkbcommon-x11.so.0 \
                      libX11.so.6 libfontconfig.so.1; do
            found="$(find "$lib" -name "$name" -print -quit)"
            if [ -z "$found" ] || ! test -e "$found"; then
              echo "::error::the AppImage does not carry $name"
              missing=1
            fi
          done
          echo "unpacked: $(du -sh squashfs-root | cut -f1)"
          cd - >/dev/null
          rm -rf "$unpacked"
          exit "$missing"

      # The AppImage itself, as a user starts it, and read back as the
      # macOS one is.  xvfb because VTK gets no OpenGL context under
      # the offscreen platform and segfaults; xcb on a virtual screen
      # with Mesa's llvmpipe is a real context on the path a desktop
      # takes.  Without setup-python's LD_LIBRARY_PATH, which points
      # into the runner's tool cache: a user's desktop has no such
      # path, and a library the bundle lost must not be found there.
      # The launcher check runs the `xtal` beside the window, inside
      # the extracted folder; the line a client is given goes through
      # AppRun instead, and the next step runs that.
      - name: Selftest (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          XTAL_NO_CONFIRM_CLOSE: "1"
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          unset LD_LIBRARY_PATH
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-utils libgl1-mesa-dri
          set -o pipefail
          images=(Crystal_Builder-*-x86_64.AppImage)
          [ "${#images[@]}" = 1 ] && [ -f "${images[0]}" ] \
              || { echo "::error::expected one AppImage, found" \
                        "${images[*]}"; exit 1; }
          xvfb-run -a -s "-screen 0 1280x1024x24" "./${images[0]}" \
              --selftest --selftest-image selftest.png | tee selftest.log
          grep -q "selftest passed" selftest.log \
              || { echo "::error::the selftest did not run to the end"; \
                   exit 1; }
          grep -q "xtal launcher: .* answers" selftest.log \
              || { echo "::error::the AppImage's xtal did not answer"; \
                   exit 1; }
          test -s selftest.png \
              || { echo "::error::the selftest drew no image"; exit 1; }

      # `<the .AppImage> xtal mcp` is the line Preferences > AI
      # assistant hands a client, and the selftest never runs it: it
      # starts the `xtal` inside the mount.  This goes through AppRun's
      # `xtal` branch as a client does, with the same two questions
      # the selftest asks.  The library path is dropped for the
      # AppImage alone: setup-python's own interpreter, which reads
      # the answer, needs it.
      - name: Launcher through the AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          images=(Crystal_Builder-*-x86_64.AppImage)
          env -u LD_LIBRARY_PATH \
              "./${images[0]}" xtal capabilities --json >capabilities.json \
              || { echo "::error::<AppImage> xtal capabilities failed"; \
                   exit 1; }
          python -c 'import json, sys; print(json.load(sys.stdin)["version"])' \
              <capabilities.json \
              || { echo "::error::<AppImage> xtal capabilities" \
                        "answered no version"; exit 1; }
          env -u LD_LIBRARY_PATH \
              "./${images[0]}" xtal mcp --headless </dev/null \
              || { echo "::error::<AppImage> xtal mcp failed"; exit 1; }

      # VTK needs an OpenGL context and the runner has no GPU.  What
      # stood here claimed Windows "falls back to the software
      # rasteriser"; it does not.  It asks for `osmesa.dll`, which is
      # not on the image -- and is not in Mesa's Windows package
      # either.  What that package has is the WGL driver, which is
      # the better answer anyway: Mesa goes beside the executable and
      # VTK's ordinary `vtkWin32OpenGLRenderWindow` gets a real
      # llvmpipe context through its normal path rather than a
      # fallback.
      #
      # The `.local` is the load-bearing half and it is one byte:
      # without it Windows resolves `opengl32.dll` from system32 and
      # never looks at the copy beside the executable, which is the
      # failure that looks exactly like not having copied it.
      - name: Software OpenGL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "26.2.0"
          $url = "https://github.com/pal1000/mesa-dist-win/releases" +
                 "/download/$version/mesa3d-$version-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          7z x mesa.7z -omesa -y | Out-Null
          $app = "dist/Crystal Builder"
          $added = @()
          foreach ($dll in "opengl32.dll", "libgallium_wgl.dll",
                           "dxil.dll") {
            Copy-Item "mesa/x64/$dll" $app -Force
            $added += $dll
          }
          Set-Content -Path "$app/Crystal Builder.exe.local" -Value ""
          $added += "Crystal Builder.exe.local"
          # Written down rather than repeated in the step that takes
          # them out again, so the two lists cannot drift apart.
          $added | Set-Content mesa-files.txt

      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          XTAL_NO_CONFIRM_CLOSE: "1"
          # llvmpipe by name, so that a Mesa which would rather use
          # d3d12 on a machine with no GPU does not quietly pick the
          # path this step is not testing.
          GALLIUM_DRIVER: llvmpipe
        run: |
          # Both preferences off, so that a non-zero exit does not
          # become a terminating error before the output it needs to
          # be diagnosed by has been printed.  The checks below are
          # what fails this step.
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          & "dist/Crystal Builder/Crystal Builder.exe" `
              --selftest --selftest-image selftest.png 2>&1 |
              Tee-Object -FilePath selftest.log
          $code = $LASTEXITCODE
          $said = Get-Content selftest.log -Raw
          if ($code -ne 0) {
            Write-Host "::error::the selftest exited $code"
            exit 1
          }
          if ($said -notmatch "selftest passed") {
            Write-Host "::error::the selftest did not run to the end"
            exit 1
          }
          if (-not (Test-Path selftest.png)) {
            Write-Host "::error::the selftest drew no image"
            exit 1
          }

      # Mesa was for the selftest and must not reach a user.  The
      # installer takes `dist\Crystal Builder\*` with recursesubdirs,
      # so anything still in that folder is shipped -- and what is in
      # it is an `opengl32.dll` that overrides the GPU driver of every
      # machine it lands on, turning a hardware-rendered viewport into
      # a software-rendered one on hardware that was fine.  Removing
      # without -ErrorAction so a file that is not there fails the
      # job, and the check after it is for the same mistake made a
      # different way.
      - name: Take the software OpenGL back out (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "dist/Crystal Builder"
          Get-Content mesa-files.txt | ForEach-Object {
            Remove-Item "$app/$_" -Force
          }
          $left = Get-ChildItem $app -Recurse -Include `
              opengl32.dll, libgallium_wgl.dll, "*.local"
          if ($left) {
            Write-Host "::error::Mesa is still in the bundle:"
            $left | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }

      # hdiutil, not create-dmg: create-dmg positions the icons by
      # driving Finder over Apple events, which a runner is not
      # authorised to do and cannot be asked to allow.  What that
      # buys is a background image and icon placement, which is
      # explicitly not phase 8; what it does not affect is the volume
      # name, the app, or the /Applications symlink to drag it to.
      - name: Package (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: python packaging/makedmg.py "dist/Crystal Builder.app" .

      # ISCC is on the runner image today, but "today" is not a
      # contract and this step only ever runs on a tag -- the worst
      # possible moment to find out otherwise.  Look for it, install
      # it if it is not there, and fail with a sentence rather than
      # with "term not recognised" if neither works.
      - name: Package (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $iscc = Get-ChildItem -Path `
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", `
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem -Path `
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", `
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" `
              -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup 6 is not on this runner and could not be installed"
          }
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          & $iscc.FullName "/DAppVersion=$version" `
            packaging\crystal-builder.iss

      # `error`, not `ignore`.  On a plain push only `selftest.png`
      # matches -- the .dmg and the installer are made on a tag; the
      # AppImage on every run, since the selftest runs it -- so this
      # asks the one question `ignore` was silently answering
      # wrong: the Windows job uploaded no artifact at all for weeks
      # and said nothing, because the image it should have carried
      # was never drawn.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}
          if-no-files-found: error
          path: |
            *.dmg
            dist/*.exe
            *.AppImage
            selftest.png

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
          body_path: docs/RELEASE_NOTES.md
          draft: true
          fail_on_unmatched_files: true
