name: ci

on:
  workflow_dispatch:

jobs:
  segfault:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libosmesa6 mesa-utils libfontconfig1 gdb
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,build,sketch,pxrd,ase,phonons,mcp,test]"
      - name: Test with cores
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: pyside6
          PYTHONFAULTHANDLER: ""
        run: |
          sudo sysctl -w kernel.core_pattern=/tmp/core.%p
          ulimit -c unlimited
          python -m pytest -q -p no:faulthandler -o faulthandler_timeout=0 || true
          ls -la /tmp/core.* || echo "no core"
      - name: Backtraces
        if: always()
        run: |
          for c in /tmp/core.*; do
            [ -f "$c" ] || continue
            echo "=== $c"
            gdb -batch -ex "thread apply all bt 25" "$(which python)" "$c" \
              2>&1 | grep -v "^\[New LWP" | head -300
          done
