[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-builder"
description = "Build, manipulate, analyse and export crystal structures"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{name = "Jules Oppenheim"}]
keywords = ["crystallography", "cif", "symmetry", "spacegroup", "uff"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

# The CORE (xtal/) needs only these.  Nothing here pulls in Qt or VTK,
# so `pip install crystal-builder` stays usable on a headless box, in
# CI, and inside a notebook.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "gemmi>=0.6",
    "spglib>=2.1",
]

[project.optional-dependencies]
# The plots this application draws *itself* are still QPainter, and
# still for the reason below: the optimisation trace
# (xtalapp/plot.py), the pore size distribution (xtalapp/histogram.py)
# and the calculated PXRD pattern (xtalapp/curve.py) are a hundred
# lines each, are less to pin and package than a large dependency, and
# follow the user's theme without being asked.  Every panel in the
# application draws with no extra installed.
#
# `pxrd` is the exception and it is the one PLAN.md section 2 named in
# advance: overlaying a measured pattern on a calculated one wants
# axes that pan, zoom and pick, and a vector export whose text is
# still text.  That is a plotting library's job and not a hundred
# lines of anything.  It stays an extra, so the pattern is still
# calculated, drawn and written as .xy without it -- what is missing
# is the overlay window, and the button says so.
#
# PySide6 is capped below 6.10 and the cap is load-bearing.  From
# 6.10.0 onward, VTK's QVTKRenderWindowInteractor.paintEvent -- which
# is one line, `self._Iren.Render()` -- renders into a paint event
# that Qt then re-posts, and the widget repaints forever at 100% of a
# core.  The window comes up, the 3D view stays empty and the
# application never responds again.  Bisected on macOS 13 against VTK
# 9.6.2 and 9.7.0, which are both fine: 6.9.3 works, 6.10.0 does not,
# and the VTK version makes no difference either way.
#
# The suite does not catch this and cannot: widget tests inject a stub
# QWidget in place of the viewport precisely so they never open a GL
# context, so every test passes against a PySide6 that hangs the real
# window.  `crystal-builder --selftest` is what catches it, which is
# why that flag opens a sample and writes a PNG of the 3D view rather
# than asserting the window exists.
#
# Revisit when VTK ships a bridge that does not render inside
# paintEvent.  Until then, raising this bound ships an application
# that cannot draw.
gui = ["PySide6>=6.6,<6.10", "vtk>=9.3"]
# Not optional any more in practice: the vendored PORMAKE
# (xtal/mof/pormake) uses ase.Atoms, ase.neighborlist and ase.io
# throughout, so the MOF builder needs it.  It stays an extra and
# stays out of `dependencies` because `pip install crystal-builder`
# must keep working on a headless box with four packages, and every
# entry point into xtal.mof already greys out without it.
ase = ["ase>=3.22"]
# The molecule builder.  Required for the feature and absent for
# everybody else: RDKit is a large wheel with a compiled core, and the
# four packages the core installs are what make `pip install
# crystal-builder` usable on a cluster node.  Without it the Build
# entries grey out naming this extra, the same way `sketch` does.
build = ["rdkit>=2023.9"]
# Drawing the molecule rather than typing it.  Its own line and not
# part of `build`, because rdeditor is PySide6 plus a theme package
# where `build` is RDKit alone -- and xtal/ imports no Qt, so a
# headless install that wants `build` must not be given a widget
# toolkit to get it.  Without it the dialog opens with the read-only
# picture and says what to install.
sketch = ["rdeditor>=0.5"]
# Overlaying a measured pattern on a calculated one, and writing the
# figure as a vector with the text still editable.  See the note above
# for why this is the one plotting dependency; without it the PXRD
# module runs, the panel draws the pattern and the .xy is written, and
# only the plot window is greyed out naming this extra.
pxrd = ["matplotlib>=3.7"]
# The MACE engine, and the heaviest thing this project can be asked to
# install: mace-torch brings torch, which is gigabytes of wheel and
# platform-specific about how it wants to arrive (CPU, CUDA, mps).
# That is the whole reason it is an extra and is deliberately *not* in
# `dev`: a contributor running the suite should not be made to
# download a deep learning framework, and the engine's own tests are
# written against a stand-in ASE calculator so that all but one of
# them run without it.  Without it the Force Field panel lists MACE
# and greys it out naming this extra, exactly as DFTB+ does for a
# missing binary.
# 0.3.14 rather than 0.3.10 because of the models offered:
# MACE-MH-1 is only known to mace_mp from 0.3.14, and a
# chooser whose entries the installed package cannot resolve
# is one where picking the newest model fails at load.
mace = ["mace-torch>=0.3.14", "ase>=3.22"]
# ORB-v3, the second ML engine, for the reasons MACE is an extra.  Its
# own line and not part of `mace`: each pins torch its own way, and
# somebody who wants one should not be made to resolve both.
# orb-models 0.7.0 pins dm-tree 0.1.8, which has no wheel for Python
# 3.13 and does not build under CMake 4 unless the environment sets
# CMAKE_POLICY_VERSION_MINIMUM=3.5; Preferences > Engines says so.
orb = ["orb-models>=0.7", "ase>=3.25"]
# MatterSim, the third, on its own line for the same reason.  It
# declares e3nn>=0.5 where mace-torch pins 0.4.4, so pip will not put
# `mace` and `mattersim` in one environment; its inference runs on
# 0.4.4, and Preferences > Engines says how to have both.
mattersim = ["mattersim>=1.2.5", "ase>=3.23"]
# pytest-qt belongs here and not in [dev]: without it every widget
# test skips itself, and CI installs [gui,test] -- so the GUI half of
# the suite was passing by not running.
test = ["pytest>=8", "pytest-qt>=4", "pytest-xdist>=3"]
dev = ["crystal-builder[gui,ase,build,sketch,pxrd,test]", "ruff",
       "pyinstaller>=6"]

[project.scripts]
xtal = "xtal.cli:main"                    # headless CLI (phase 1)
crystal-builder = "xtalapp.main:main"     # the GUI (phase 2)

[project.urls]
Repository = "https://github.com/JulesOpp/Crystal-Builder"

[tool.setuptools]
packages = ["xtal", "xtal.core", "xtal.io", "xtal.commands", "xtal.ff",
            # Every engine's package, and all of them rather than the
            # one that used to be here: `xtal.ff` imports each
            # calculator at import, so a wheel missing one of these
            # cannot import `xtal.ff` at all.
            "xtal.ff.uff", "xtal.ff.dftb", "xtal.ff.xtb",
            "xtal.ff.mace", "xtal.ff.orb", "xtal.ff.mattersim",
            "xtal.ff.charges",
            "xtal.modules", "xtal.modules.dftb_runs", "xtal.analysis",
            "xtal.mof", "xtal.mof.pormake", "xtal.mof.library",
            "xtal.build", "xtal.build.data",
            "xtalapp", "xtalapp.viewport", "xtalapp.docks",
            "xtalapp.dialogs", "xtalapp.widgets"]

# The RCSR index is not optional and is not an external asset: the net
# panel cannot name anything without it, so it travels inside the
# package rather than in resources/, which is a source-checkout
# convenience.  The .cgd beside it is the nets themselves rather than
# the index of them, and ships for a second reason: the index holds no
# coordinates, so it can say a structure is pcu and cannot draw one.
# 1.8 MB of text, 331 KB compressed.
[tool.setuptools.package-data]
"xtal.analysis" = ["data/*.json.gz", "data/*.cgd.gz"]
# The fragment library, for the same reason: a picker with nothing in
# it is not a smaller feature, it is a broken one.  Text, kilobytes,
# and read through importlib.resources so a wheel and a source
# checkout are the same case.
"xtal.build.data" = ["*.json"]
# EQeq's ionisation table, written by scripts/eqeq_table.py.  A charge
# source offered in the panel that cannot find its table is a
# traceback when Optimise is pressed.  6 KB.
"xtal.ff.charges" = ["data/*.csv"]
# The script Blender runs for Export as STL.  Handed to Blender by
# path, so it has to be a file on disk in the installed package.
"xtal.modules" = ["data/*.py"]
# PORMAKE's nets and building blocks, vendored with it.  Not optional
# by the same argument: a topology picker with nothing in it is not a
# smaller MOF builder, it is a broken one, and there is no second
# database to fall back on.  3271 files and 2.8 MB, and the licence
# and the record of what was changed travel beside it.
"xtal.mof.pormake" = ["database/topologies/*.cgd", "database/bbs/*.xyz",
                      "LICENSE.md", "PROVENANCE.md"]
# The four polydentate blocks this application ships of its own.  Four
# files, and the only ones anywhere whose connection points stand for
# more than one atom -- without them the builder has 867 blocks and
# cannot build MFU-4l.  The layer nets are not here: they are the
# RCSR's, from xtal.analysis's gzipped .cgd.
"xtal.mof.library" = ["blocks/*.xyz"]

[tool.setuptools_scm]        # version from git tags; no version file to bump

[tool.pytest.ini_options]
testpaths = ["tests"]
# Serial, deliberately, and it costs about a minute.
#
# Parallel is three and a half times faster -- 25 s against 92 -- and
# it wedged four runs out of eight.  The cause is a lock-order
# inversion between Qt's connection mutex and the GIL: PySide6 frees a
# QThread's Python wrapper inside signal delivery, which calls back
# into Python for disconnectNotify while Qt holds the mutex, and any
# thread that holds the GIL and asks Qt to connect something waits for
# that mutex forever.  It presents as the run stopping dead in
# MainWindow.__init__ with no Python frame to blame, and it can hang
# the shipped application the same way when a module run finishes.
#
# The deadlock is inside one process, so serial did not make it
# impossible -- eight workers' worth of contention is what made it
# likely, and eight serial runs in a row were clean where four of
# eight parallel ones were not.
#
# Fixed 2026-09-21: nothing is deleted by Qt any more, both objects
# are owned from Python on the GUI thread, and a stress harness that
# aborted three configurations of five went clean in all fifteen runs.
# So this is the line above taken at its word -- it said to put
# "-n auto" back once workers.py no longer lets a wrapper be freed
# during signal delivery, and it no longer does.
#
# Five consecutive whole-suite runs here came back clean at 65-111 s
# against 220 s serial.  That is evidence rather than proof: at the
# old rate five in a row is about a 3 % event, and conftest.py:62
# records a second wedge cause -- eight workers contending on
# cfprefsd -- which the INI-backend guard addressed but which nobody
# has re-measured under load.  If a run wedges, "-n0" here is the
# whole of the way back, and CLAUDE.md says how to clear the orphaned
# workers first.
addopts = ["-n", "auto"]
# Both PORMAKE deprecations that used to be ignored here are gone,
# and they are worth a sentence because the fix was the same one.
# They were a dependency's lines in a dependency's code -- scipy's
# `disp` in the cell relaxation, ase's `get_cell_lengths_and_angles`
# in the CIF writer -- so there was nothing to do but ignore them.
# Vendoring made them ours, and they are fixed at the line rather
# than suppressed here.  The ase one mattered more than it looked:
# PORMAKE catches whatever the write raises, deletes the half-written
# file and logs it, so every build test failed on a *missing CIF*
# rather than on the deprecation.
#
# The one that is here is not ours and cannot be made ours the same
# way: ase's `Atoms.new_array` sets `.shape` on an empty array, which
# numpy 2.5 deprecated, so building any block slices an Atoms and
# every MOF test fails on ase 3.29 -- the newest there is -- the
# moment numpy 2.5 is installed.  The alternatives were pinning numpy
# below 2.5 for everybody, or vendoring ase as well.  It is scoped to
# that one message in that one module so a new deprecation anywhere
# else still fails the run.
# The second of the same kind, and the same argument.  MACE is built
# on ``torch.jit`` -- ``e3nn`` scripts its modules and a checkpoint is
# loaded with ``torch.jit.load`` -- and torch 2.11 deprecates that
# whole interface in favour of ``torch.export``.  The warnings are
# raised inside torch on the way past, so with deprecations as errors
# the model would not even load: the download succeeded and the load
# came back as "the MACE model could not be loaded".
#
# Scoped to the ``torch.jit`` family rather than to each message,
# because they arrive one per entry point (``script`` on import,
# ``load`` on first use) and a filter naming one leaves the next to be
# found by a red suite.  Not scoped to a module either: what raises
# them is torch's and what calls them is e3nn's and MACE's, and
# pinning either is a guess that goes stale silently.  Every other
# torch deprecation still fails the run, as does every one of ours.
filterwarnings = [
    "error::DeprecationWarning",
    'ignore:Setting the shape on a NumPy array:DeprecationWarning:ase\.atoms',
    'ignore:`torch\.jit\.:DeprecationWarning',
]
markers = [
    # Seconds rather than milliseconds, and worth it: a variable-cell
    # relaxation of a 648-atom framework is the only test that
    # exercises the whole force field on a real deposited structure.
    "slow: takes seconds; deselect with -m 'not slow'",
    # Applied by tests/conftest.py to every module importing xtalapp or
    # PySide6, so a change to the headless core runs -m "not gui".
    "gui: imports Qt; deselect with -m 'not gui'",
]

[tool.ruff]
line-length = 79
# Somebody else's code, vendored verbatim so that it can be diffed
# against the version it came from.  It fails this project's lint in
# twenty places -- `[]` defaults, `.format` over f-strings, an
# ambiguous `I`, four long lines -- all of them upstream's own style
# and none of them a defect.  Rewrapping it to 79 columns is how a
# vendored tree stops being diffable, which is the one thing
# `xtal/mof/pormake/PROVENANCE.md` exists to preserve.  The two
# substitutions this project actually made are held to the line
# length by hand.
# The script that generated `resources/topo/TopCIF/` once, kept for
# the same reason and failing lint in 146 places -- tabs, `l` as a
# loop variable, lines past 79, a hardcoded path into somebody's
# Downloads.  It is a record of how those files were made and of the
# numbers `xtal/build/topology.py` inherited from it (scale 8, eight
# beads, occupancy 0.1), and reformatting a record is how it stops
# being one.  Nothing imports it and nothing runs it.
# Blender's side of Export as STL, which Blender runs and nothing here
# imports: the author's own tool, shipped unchanged so that it stays
# the same script they maintain -- `xtal/modules/blender.py`.
# The probes under `probes/`, for the third time: each one is a
# standalone script that puts its own directory on `sys.path` before
# importing its sibling, so sorting its imports breaks it, and each is
# a record of a measurement that decided a design rather than code
# anything ships or imports.  `probes/polydentate/README.md` says what
# they measured.
extend-exclude = ["xtal/mof/pormake", "resources/topo/Top2Cif.py",
                  "xtal/modules/data/pdb_to_printable_stl.py",
                  "probes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The UFF parameter table is a transcription of a published table.
# Wrapping its rows to 79 columns would break the alignment that makes
# a 127-row table readable, and reformatting transcribed data is how
# transcription errors get introduced.
"xtal/ff/uff/params.py" = ["E501"]
# i-j-k-l for the four atoms of a dihedral, and i-j-k for an angle, is
# the notation of every force-field paper and every implementation of
# one.  Renaming l here to satisfy the ambiguous-name rule would make
# the code harder to check against the equations it implements.
"xtal/ff/uff/terms.py" = ["E741"]
