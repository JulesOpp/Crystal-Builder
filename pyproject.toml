[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-builder"
description = "Build, manipulate, analyse and export crystal structures"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{name = "Jules Oppenheim"}]
keywords = ["crystallography", "cif", "symmetry", "spacegroup", "uff"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

# The CORE (xtal/) needs only these.  Nothing here pulls in Qt or VTK,
# so `pip install crystal-builder` stays usable on a headless box, in
# CI, and inside a notebook.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "gemmi>=0.6",
    "spglib>=2.1",
]

[project.optional-dependencies]
# No plotting library: the one plot the application draws (the live
# optimisation trace) is a hundred lines of QPainter in xtalapp/plot.py,
# which is less to pin and package than a second large dependency and
# follows the user's theme without being asked.
#
# PySide6 is capped below 6.10 and the cap is load-bearing.  From
# 6.10.0 onward, VTK's QVTKRenderWindowInteractor.paintEvent -- which
# is one line, `self._Iren.Render()` -- renders into a paint event
# that Qt then re-posts, and the widget repaints forever at 100% of a
# core.  The window comes up, the 3D view stays empty and the
# application never responds again.  Bisected on macOS 13 against VTK
# 9.6.2 and 9.7.0, which are both fine: 6.9.3 works, 6.10.0 does not,
# and the VTK version makes no difference either way.
#
# The suite does not catch this and cannot: widget tests inject a stub
# QWidget in place of the viewport precisely so they never open a GL
# context, so every test passes against a PySide6 that hangs the real
# window.  `crystal-builder --selftest` is what catches it, which is
# why that flag opens a sample and writes a PNG of the 3D view rather
# than asserting the window exists.
#
# Revisit when VTK ships a bridge that does not render inside
# paintEvent.  Until then, raising this bound ships an application
# that cannot draw.
gui = ["PySide6>=6.6,<6.10", "vtk>=9.3"]
# Not optional any more in practice: the vendored PORMAKE
# (xtal/mof/pormake) uses ase.Atoms, ase.neighborlist and ase.io
# throughout, so the MOF builder needs it.  It stays an extra and
# stays out of `dependencies` because `pip install crystal-builder`
# must keep working on a headless box with four packages, and every
# entry point into xtal.mof already greys out without it.
ase = ["ase>=3.22"]
# The molecule builder.  Required for the feature and absent for
# everybody else: RDKit is a large wheel with a compiled core, and the
# four packages the core installs are what make `pip install
# crystal-builder` usable on a cluster node.  Without it the Build
# entries grey out naming this extra, the same way `sketch` does.
build = ["rdkit>=2023.9"]
# Drawing the molecule rather than typing it.  Its own line and not
# part of `build`, because rdeditor is PySide6 plus a theme package
# where `build` is RDKit alone -- and xtal/ imports no Qt, so a
# headless install that wants `build` must not be given a widget
# toolkit to get it.  Without it the dialog opens with the read-only
# picture and says what to install.
sketch = ["rdeditor>=0.5"]
# pytest-qt belongs here and not in [dev]: without it every widget
# test skips itself, and CI installs [gui,test] -- so the GUI half of
# the suite was passing by not running.
test = ["pytest>=8", "pytest-qt>=4", "pytest-xdist>=3"]
dev = ["crystal-builder[gui,ase,build,sketch,test]", "ruff",
       "pyinstaller>=6"]

[project.scripts]
xtal = "xtal.cli:main"                    # headless CLI (phase 1)
crystal-builder = "xtalapp.main:main"     # the GUI (phase 2)

[project.urls]
Repository = "https://github.com/JulesOpp/Crystal-Builder"

[tool.setuptools]
packages = ["xtal", "xtal.core", "xtal.io", "xtal.commands", "xtal.ff",
            "xtal.ff.uff", "xtal.modules", "xtal.analysis", "xtal.mof",
            "xtal.mof.pormake",
            "xtal.build", "xtal.build.data",
            "xtalapp", "xtalapp.viewport", "xtalapp.docks",
            "xtalapp.dialogs"]

# The RCSR index is not optional and is not an external asset: the net
# panel cannot name anything without it, so it travels inside the
# package rather than in resources/, which is a source-checkout
# convenience.  The .cgd it is built from stays in resources/topo.
[tool.setuptools.package-data]
"xtal.analysis" = ["data/*.json.gz"]
# The fragment library, for the same reason: a picker with nothing in
# it is not a smaller feature, it is a broken one.  Text, kilobytes,
# and read through importlib.resources so a wheel and a source
# checkout are the same case.
"xtal.build.data" = ["*.json"]
# PORMAKE's nets and building blocks, vendored with it.  Not optional
# by the same argument: a topology picker with nothing in it is not a
# smaller MOF builder, it is a broken one, and there is no second
# database to fall back on.  3271 files and 2.8 MB, and the licence
# and the record of what was changed travel beside it.
"xtal.mof.pormake" = ["database/topologies/*.cgd", "database/bbs/*.xyz",
                      "LICENSE.md", "PROVENANCE.md"]

[tool.setuptools_scm]        # version from git tags; no version file to bump

[tool.pytest.ini_options]
testpaths = ["tests"]
# Serial, deliberately, and it costs about a minute.
#
# Parallel is three and a half times faster -- 25 s against 92 -- and
# it wedged four runs out of eight.  The cause is a lock-order
# inversion between Qt's connection mutex and the GIL: PySide6 frees a
# QThread's Python wrapper inside signal delivery, which calls back
# into Python for disconnectNotify while Qt holds the mutex, and any
# thread that holds the GIL and asks Qt to connect something waits for
# that mutex forever.  It presents as the run stopping dead in
# MainWindow.__init__ with no Python frame to blame, and it can hang
# the shipped application the same way when a module run finishes.
#
# The deadlock is inside one process, so serial does not make it
# impossible -- eight workers' worth of contention is what made it
# likely, and eight serial runs in a row were clean where four of
# eight parallel ones were not.  A minute that finishes beats
# twenty-five seconds that stops one time in two.
#
# Put "-n auto" back once workers.py no longer lets a wrapper be
# freed during signal delivery.  See CLAUDE.md.
addopts = ["-n0"]
# Both PORMAKE deprecations that used to be ignored here are gone,
# and they are worth a sentence because the fix was the same one.
# They were a dependency's lines in a dependency's code -- scipy's
# `disp` in the cell relaxation, ase's `get_cell_lengths_and_angles`
# in the CIF writer -- so there was nothing to do but ignore them.
# Vendoring made them ours, and they are fixed at the line rather
# than suppressed here.  The ase one mattered more than it looked:
# PORMAKE catches whatever the write raises, deletes the half-written
# file and logs it, so every build test failed on a *missing CIF*
# rather than on the deprecation.
filterwarnings = ["error::DeprecationWarning"]
markers = [
    # Seconds rather than milliseconds, and worth it: a variable-cell
    # relaxation of a 648-atom framework is the only test that
    # exercises the whole force field on a real deposited structure.
    "slow: takes seconds; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 79
# Somebody else's code, vendored verbatim so that it can be diffed
# against the version it came from.  It fails this project's lint in
# twenty places -- `[]` defaults, `.format` over f-strings, an
# ambiguous `I`, four long lines -- all of them upstream's own style
# and none of them a defect.  Rewrapping it to 79 columns is how a
# vendored tree stops being diffable, which is the one thing
# `xtal/mof/pormake/PROVENANCE.md` exists to preserve.  The two
# substitutions this project actually made are held to the line
# length by hand.
extend-exclude = ["xtal/mof/pormake"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The UFF parameter table is a transcription of a published table.
# Wrapping its rows to 79 columns would break the alignment that makes
# a 127-row table readable, and reformatting transcribed data is how
# transcription errors get introduced.
"xtal/ff/uff/params.py" = ["E501"]
# i-j-k-l for the four atoms of a dihedral, and i-j-k for an angle, is
# the notation of every force-field paper and every implementation of
# one.  Renaming l here to satisfy the ambiguous-name rule would make
# the code harder to check against the equations it implements.
"xtal/ff/uff/terms.py" = ["E741"]
